[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dgg-latent"
version = "0.1.0"
description = "Continuous latent diffusion sampling, custom loss formulations, and dual readout heads for DiffusionGemma"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "bumblebeers", email = "21022766+bumblebeers@users.noreply.github.com"}]
keywords = [
    "diffusion",
    "gemma",
    "latent-diffusion",
    "neural-code-graphs",
    "deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "transformers>=4.45.0",
]

[project.urls]
Homepage = "https://github.com/bumblebeers/dgg-latent"
Repository = "https://github.com/bumblebeers/dgg-latent"
PaperRepository = "https://github.com/bumblebeers/dgg2-latent-code-graphs"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools]
packages = ["dgg_latent"]

[tool.setuptools.package-dir]
dgg_latent = "."

