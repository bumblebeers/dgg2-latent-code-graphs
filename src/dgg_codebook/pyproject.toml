[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dgg-codebook"
version = "0.1.0"
description = "Continuous vocabulary distribution derivation, statistical codebook de-biasing, and spatial teacher models for DiffusionGemma"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "bumblebeers", email = "21022766+bumblebeers@users.noreply.github.com"}]
keywords = [
    "diffusiongemma",
    "codebook",
    "vocabulary-distribution",
    "spatial-teacher",
    "debiasing",
    "continuous-embeddings",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
]

[project.urls]
Homepage = "https://github.com/bumblebeers/dgg-codebook"
Repository = "https://github.com/bumblebeers/dgg-codebook"
PaperRepository = "https://github.com/bumblebeers/dgg2-latent-code-graphs"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools]
packages = ["dgg_codebook"]

[tool.setuptools.package-dir]
dgg_codebook = "."

