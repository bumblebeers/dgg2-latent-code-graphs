[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dgg-vit-decoder"
version = "0.1.0"
description = "Standalone vision-stack-only loader and 34M ViT+Conv image decoder for DiffusionGemma"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "bumblebeers", email = "21022766+bumblebeers@users.noreply.github.com"}]
keywords = [
    "diffusiongemma",
    "vision-stack",
    "image-decoder",
    "vit-conv",
    "pixel-reconstruction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "Pillow>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/bumblebeers/dgg-vit-decoder"
Repository = "https://github.com/bumblebeers/dgg-vit-decoder"
PaperRepository = "https://github.com/bumblebeers/dgg2-latent-code-graphs"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools]
packages = ["dgg_vit_decoder"]

[tool.setuptools.package-dir]
dgg_vit_decoder = "."

